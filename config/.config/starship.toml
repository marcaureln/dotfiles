# Minimalist Starship config - single line with git + directory

# Single line format
format = "$directory$git_branch$git_status$aws➜ "

# Directory settings
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

# Git branch
[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

# Git status
[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "\\$"
modified = "!"
staged = "++"
renamed = "»"
deleted = "✘"

# AWS profile
[aws]
symbol = "🌐 "
style = "bold orange"
format = "[$symbol($profile)]($style) "
